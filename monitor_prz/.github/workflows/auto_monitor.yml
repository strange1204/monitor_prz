name: PRZ 24/7 Real-Time Cloud Monitor

on:
  schedule:
    - cron: '*/5 * * * *'  # GitHub Actions Cloud Cron (Every 5 minutes)
  workflow_dispatch:        # Manual Trigger Button

jobs:
  realtime-monitor:
    name: Run Real-Time PRZ High-Confidence Signal Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy

      - name: Run Single-Check Auto Monitor & Email Alert
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || 'strange751204@gmail.com' }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER || 'brian555878@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'qaua nssw vztv ytbk' }}
          PYTHONUTF8: '1'
        run: |
          python auto_monitor.py --single-run
