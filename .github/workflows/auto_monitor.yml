name: Routine Task Pipeline

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  task-runner:
    name: Run Task Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pandas numpy

      - name: Execute Routine Task Process
        env:
          GMAIL_SENDER: ${{ secrets.GMAIL_SENDER || 'strange751204@gmail.com' }}
          GMAIL_RECEIVER: ${{ secrets.GMAIL_RECEIVER || 'brian555878@gmail.com' }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD || 'qaua nssw vztv ytbk' }}
          PYTHONUTF8: '1'
        run: |
          python -c "
          import time
          from auto_monitor import run_single_check
          print('Processing routine task pipeline...')
          for minute in range(55):
              try:
                  run_single_check()
              except Exception as e:
                  print('Task log:', e)
              time.sleep(60)
          print('Cycle completed.')
          "
